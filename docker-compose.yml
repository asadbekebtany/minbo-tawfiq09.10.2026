services:
  postgres:
    image: postgres:16-alpine
    container_name: tavfiq-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tavfiq
    volumes:
      - tavfiq_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tavfiq"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  tavfiq_pg_data:
