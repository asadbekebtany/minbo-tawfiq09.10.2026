# Netlify: faqat Git orqali deploy (App/Drop zip emas).
# Kerakli env: DATABASE_URL, NEXTAUTH_SECRET, NEXTAUTH_URL, APP_ENV=production

[build]
  command = "npx prisma generate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js Runtime Netlify tomonidan avtomatik ulanadi.
# Prisma client Linux binarylari schema.prisma da binaryTargets orqali.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
